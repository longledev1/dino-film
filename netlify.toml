# Netlify Configuration for Dino Film (React + Vite SPA)

[build]
  publish = "dist"
  command = "npm run build"

# SPA Fallback: Redirect all routes to index.html with 200 status for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
